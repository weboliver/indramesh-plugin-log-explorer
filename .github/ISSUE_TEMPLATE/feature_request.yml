name: Feature request
description: Propose a capability or a change in behaviour.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the proposal. The most useful proposals start from a use case rather than from
        an implementation, so please describe the problem first.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that the product does not let you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Sketches, API shapes and examples are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else could solve the problem, and why is it worse?
    validations:
      required: true