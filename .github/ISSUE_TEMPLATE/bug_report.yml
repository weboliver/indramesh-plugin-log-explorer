name: Bug report
description: Something does not work as documented.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        Please do **not** report a security vulnerability here — use the repository's private
        advisory reporting instead (see `SECURITY.md`). And please leave credentials, tokens and
        private data from your instance out of the report.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The smallest reproduction you can manage.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release or image tag you are running.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation
      description: How is this instance deployed?
      options:
        - Docker Compose
        - Single-node Kubernetes (k3s)
        - Other
    validations:
      required: true
  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      description: This project has a Code of Conduct that applies in all of its spaces.
      options:
        - label: I agree to follow this project's Code of Conduct.
          required: true